<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Ricettario</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ricettario: scopri, salva e condividi ricette con la community.">
  <meta name="theme-color" content="#1a3690">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:ital,wght@0,400..800;1,400&display=swap">
  <script>
    // Applica il tema salvato prima del primo paint (evita il flash).
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
