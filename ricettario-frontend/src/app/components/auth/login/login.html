<app-auth-shell heading="Bentornato in cucina" sub="Accedi per salvare, votare e pubblicare ricette.">
  @if (registered) { <p class="alert alert--success" role="status"><app-icon name="check" [size]="18" /> Account creato. Ora puoi accedere.</p> }
  @if (expired) { <p class="alert alert--info" role="status"><app-icon name="lock" [size]="18" /> La sessione è scaduta: accedi di nuovo.</p> }

  <form class="auth-form" (ngSubmit)="onLogin()" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" class="input" [(ngModel)]="credential.username" autocomplete="username" required />
    </div>
    <div class="field">
      <div class="label-row">
        <label for="password">Password</label>
        <a routerLink="/forgot-password">Password dimenticata?</a>
      </div>
      <div class="input-wrap">
        <input id="password" name="password" class="input" [type]="showPassword ? 'text' : 'password'"
               [(ngModel)]="credential.password" autocomplete="current-password" required />
        <button type="button" class="btn btn--ghost btn--icon btn--sm" (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Nascondi password' : 'Mostra password'" [attr.aria-pressed]="showPassword">
          <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </div>
    </div>

    @if (errorMess) { <p class="alert" role="alert"><app-icon name="alert" [size]="18" /> {{ errorMess }}</p> }

    <button type="submit" class="btn btn--primary btn--block" [disabled]="loading">
      @if (loading) { <span class="spinner" aria-hidden="true"></span> } Accedi
    </button>
  </form>

  <p class="auth-alt">Prima volta qui? <a routerLink="/register">Crea un account</a></p>
</app-auth-shell>
