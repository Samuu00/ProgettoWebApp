<app-auth-shell heading="Crea il tuo account" sub="Gratis. Salva le ricette che ami e pubblica le tue." quote="Ogni famiglia ha una ricetta da tramandare.">
  <form class="auth-form" (ngSubmit)="onRegister()" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" class="input" [(ngModel)]="userData.username" (blur)="touched.username = true"
             autocomplete="username" [attr.aria-invalid]="!!show('username')" aria-describedby="u-err" />
      @if (show('username')) { <p id="u-err" class="field-error">{{ show('username') }}</p> }
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" class="input" [(ngModel)]="userData.email" (blur)="touched.email = true"
             autocomplete="email" inputmode="email" [attr.aria-invalid]="!!show('email')" aria-describedby="e-err" />
      @if (show('email')) { <p id="e-err" class="field-error">{{ show('email') }}</p> }
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input id="password" name="password" class="input" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="userData.password"
               (blur)="touched.password = true" autocomplete="new-password" aria-describedby="pw-rules" [attr.aria-invalid]="!!show('password')" />
        <button type="button" class="btn btn--ghost btn--icon btn--sm" (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Nascondi password' : 'Mostra password'" [attr.aria-pressed]="showPassword">
          <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="18" />
        </button>
      </div>
      <app-password-rules [value]="userData.password" />
    </div>
    <div class="field">
      <label for="confirm">Conferma password</label>
      <input id="confirm" name="confirm" class="input" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="userData.confirmPassw"
             (blur)="touched.confirmPassw = true" autocomplete="new-password" [attr.aria-invalid]="!!show('confirmPassw')" aria-describedby="c-err" />
      @if (show('confirmPassw')) { <p id="c-err" class="field-error">{{ show('confirmPassw') }}</p> }
    </div>

    @if (errorMess) { <p class="alert" role="alert"><app-icon name="alert" [size]="18" /> {{ errorMess }}</p> }

    <button type="submit" class="btn btn--primary btn--block" [disabled]="loading">
      @if (loading) { <span class="spinner" aria-hidden="true"></span> } Crea account
    </button>
  </form>
  <p class="auth-alt">Hai già un account? <a routerLink="/login">Accedi</a></p>
</app-auth-shell>
