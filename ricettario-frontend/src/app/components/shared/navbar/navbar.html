<header class="nav">
  <div class="container nav__bar">
    <a class="brand" [routerLink]="auth.user() ? '/recipe-list' : '/login'" aria-label="Ricettario, vai alla home">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#f5c518" />
        <path d="M16 5c3 4 3 8 0 11c-3-3-3-7 0-11zM16 27c3-4 3-8 0-11c-3 3-3 7 0 11zM5 16c4-3 8-3 11 0c-3 3-7 3-11 0zM27 16c-4-3-8-3-11 0c3 3 7 3 11 0z" fill="#1a3690" />
        <circle cx="16" cy="16" r="2.2" fill="#f5c518" />
      </svg>
      <span class="brand__name">Ricettario</span>
    </a>

    <div class="nav__tools">
      <button type="button" class="nav__icon-btn" (click)="toggleTheme()"
              [attr.aria-label]="theme() === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro'">
        <app-icon [name]="theme() === 'dark' ? 'sun' : 'moon'" />
      </button>

      @if (auth.user()) {
        <button type="button" class="nav__icon-btn nav__burger" (click)="menuOpen.set(!menuOpen()); userMenuOpen.set(false)"
                [attr.aria-expanded]="menuOpen()" aria-controls="nav-panel" aria-label="Menu">
          <app-icon [name]="menuOpen() ? 'x' : 'menu'" />
        </button>
      }
    </div>

    @if (auth.user(); as user) {
      <nav id="nav-panel" class="nav__panel" [class.is-open]="menuOpen()" aria-label="Principale">
        <ul class="nav__links">
          <li><a routerLink="/recipe-list" routerLinkActive="is-active" ariaCurrentWhenActive="page">Ricette</a></li>
          <li><a routerLink="/favorites" routerLinkActive="is-active" ariaCurrentWhenActive="page">Preferiti</a></li>
          <li><a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page">La mia cucina</a></li>
          @if (auth.isAdminSignal()) {
            <li>
              <a routerLink="/admin" routerLinkActive="is-active" ariaCurrentWhenActive="page">
                <app-icon name="shield" [size]="16" /> Admin
              </a>
            </li>
          }
        </ul>

        <a routerLink="/recipe-create" class="btn btn--accent btn--sm nav__cta">
          <app-icon name="plus" [size]="18" /> Nuova ricetta
        </a>

        <div class="usermenu">
          <button type="button" class="usermenu__trigger" (click)="userMenuOpen.set(!userMenuOpen())"
                  [attr.aria-expanded]="userMenuOpen()" aria-controls="user-menu">
            <span class="avatar">{{ initial() }}</span>
            <span class="usermenu__name">{{ user.username }}</span>
          </button>
          <div id="user-menu" class="usermenu__pop" [hidden]="!userMenuOpen()">
            <p class="usermenu__who">
              <strong>{{ user.username }}</strong>
              <span>{{ user.email }}</span>
            </p>
            <a routerLink="/profile"><app-icon name="user" [size]="18" /> Profilo</a>
            <button type="button" (click)="onLogOut()"><app-icon name="log-out" [size]="18" /> Esci</button>
          </div>
        </div>
      </nav>
    } @else {
      <nav class="nav__guest" aria-label="Accesso">
        <a routerLink="/login" routerLinkActive="is-active">Accedi</a>
        <a routerLink="/register" class="btn btn--accent btn--sm">Registrati</a>
      </nav>
    }
  </div>
  <div class="nav__strip" aria-hidden="true"></div>
</header>
