spring.application.name=ricettario-backend

# Tutti i valori sensibili arrivano da variabili d'ambiente: vedi .env.example
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ricettario}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Obbligatoria, almeno 32 caratteri (es. `openssl rand -base64 48`)
app.jwt.secret=${JWT_SECRET}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
# Lista separata da virgole
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
